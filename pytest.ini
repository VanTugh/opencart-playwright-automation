[pytest]
testpaths = .
python_files = test_*.py main.py
python_classes = Test*
python_functions = test_*
addopts = --tb=short --strict-markers -v --html=reports/test_report.html --self-contained-html
markers =
    high: High priority test cases
    medium: Medium priority test cases
    low: Low priority test cases
    registration: UC_01 tests
    login: UC_02 tests
    password: UC_03 tests
    address: UC_04 tests
    wishlist: UC_05 tests
    comparison: UC_06 tests
    review: UC_07 tests
    cart: UC_08 tests
    checkout: UC_09 tests
    order: UC_10 tests
    category: UC_11 tests
    product: UC_12 tests
    discount: UC_13 tests
    coupon: UC_14 tests
    category_seo: UC_15 tests
    product_seo: UC_16 tests
    product_attribute: UC_17 tests
    product_related: UC_18 tests
    currency: UC_19 tests
    customer_group: UC_20 tests
    security: Red Team security stress tests
    extreme: Extreme severity security tests
    hard: Hard severity security tests
    fail_case: Toan bo cac kich ban kiem thu lo hong logic chac chan fail
    critical: Kich ban kiem thu muc do uu tien cao
    medium: Kich ban kiem thu muc do uu tien trung binh
    performance: Kịch bản kiểm thử hiệu năng, độ trễ và khả năng chịu tải hệ thống
    security: Kịch bản kiểm thử các lỗ hổng bảo mật và lỗi logic nghiệp vụ
    usability: Kịch bản quét lỗi giao diện, khả năng đáp ứng và trải nghiệm người dùng
    basic: Các kịch bản kiểm thử phi chức năng mức độ cơ bản
    advanced: Các kịch bản rà quét nâng cao săn tìm điểm nghẽn và lỗ hổng lớn
